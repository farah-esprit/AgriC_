parameters:
  knp_paginator:
    page_range: 10
    items_per_page: 10

services:
  # ... existing services ...

knp_paginator:
  page_range: 10                        # Nombre de liens pagination affichés
  default_options:
    page_name: page                     # Paramètre page en URL
    distinct: true                      # Distinct SQL pour éviter doublons
  page_limit: null
  convert_exception: false
  template:
    pagination: '@KnpPaginator/Pagination/bootstrap_v5_pagination.html.twig'
    sortable: '@KnpPaginator/Pagination/sortable_link.html.twig'
    filtration: '@KnpPaginator/Pagination/filtration.html.twig'
